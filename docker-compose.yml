services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: coffeeschedule
      POSTGRES_USER: coffeeschedule
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-coffeeschedule}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U coffeeschedule"]
      interval: 5s
      retries: 10

volumes:
  pgdata:
